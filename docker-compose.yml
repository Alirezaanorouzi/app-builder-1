services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: appbuilder
      POSTGRES_PASSWORD: appbuilder
      POSTGRES_DB: appbuilder
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations/0001_init.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
      - ./db/migrations/0002_agent_server.sql:/docker-entrypoint-initdb.d/0002_agent_server.sql:ro
      - ./db/migrations/0003_sandbox_wake.sql:/docker-entrypoint-initdb.d/0003_sandbox_wake.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appbuilder -d appbuilder"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    profiles:
      - s3

volumes:
  postgres_data:
  minio_data: