[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "app-builder-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary,pool]>=3.2.0",
  "pydantic>=2.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
openhands = [
  "openhands-sdk==1.63.1",
  "openhands-tools==1.63.1",
]
vercel = ["vercel>=0.3.0"]
s3 = ["boto3>=1.34.0"]
dev = ["openhands-sdk==1.63.1", "openhands-tools==1.63.1", "vercel>=0.3.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]